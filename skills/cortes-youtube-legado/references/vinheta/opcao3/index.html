<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
<title>Vinheta Legacy opcao3</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
@font-face { font-family: "SFPro"; src: url("assets/SF-Pro-Display-Medium.otf"); }
body { margin: 0; background: #000; }
#root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #000; }
.fill { position: absolute; inset: 0; }
#bg { background: radial-gradient(ellipse at 50% 48%, #0b1426 0%, #04070d 70%); }
#grade { background-image: repeating-linear-gradient(0deg, rgba(120,170,255,.045) 0 1px, transparent 1px 96px),
                           repeating-linear-gradient(90deg, rgba(120,170,255,.045) 0 1px, transparent 1px 96px);
         -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, transparent 70%); mask-image: radial-gradient(ellipse at 50% 50%, #000 0%, transparent 70%); }
#vinheta { background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.65) 100%); }
#logo { position: absolute; left: 554px; top: 442px; width: 812px; height: 176px; }
#simb { position: absolute; left: 0; top: 0; width: 226px; height: 176px; }
#simb img, #txt img { width: 100%; height: 100%; display: block; }
#txt { position: absolute; left: 245px; top: 27px; width: 567px; height: 149px; }
#brilho { position: absolute; left: 0; top: 0; width: 812px; height: 176px;
          background: linear-gradient(110deg, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%);
          background-size: 300% 100%; background-position: 100% 0;
          -webkit-mask-image: url("assets/logo_completo.png"); mask-image: url("assets/logo_completo.png");
          -webkit-mask-size: 100% 100%; mask-size: 100% 100%; opacity: 0; }
#linha { position: absolute; left: 410px; top: 658px; width: 1100px; height: 2px;
         background: linear-gradient(90deg, transparent, #8fbaff 35%, #ffffff 50%, #8fbaff 65%, transparent);
         box-shadow: 0 0 18px 2px rgba(80,140,255,.55); }
#url { position: absolute; left: 0; right: 0; top: 682px; text-align: center; font-family: "SFPro";
       font-size: 22px; letter-spacing: 9px; color: rgba(190,212,255,.85); }
#preto { background: #000; }
</style></head>
<body>
<div id="root" data-composition-id="vinheta" data-start="0" data-width="1920" data-height="1080" data-duration="4.5">
  <div id="bg" class="fill"></div><div id="vinheta" class="fill"></div>
  <div id="linha"></div>
  <div id="logo"><div id="simb"><img src="assets/simbolo.png" alt="" /></div>
    <div id="txt"><img src="assets/texto.png" alt="" /></div><div id="brilho"></div></div>
  <div id="url">LEGACYEXECUTORIA.COM.BR</div>
  <div id="preto" class="fill"></div>
</div>
<script>
const tl = gsap.timeline({ paused: true });

tl.fromTo("#preto", {opacity: 1}, {opacity: 0, duration: 0.3}, 0);
tl.fromTo("#logo", {opacity: 0, scale: 1.08, filter: "blur(22px)"}, {opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.2, ease: "power3.out"}, 0.15);
tl.fromTo("#linha", {scaleX: 0, opacity: 0.8}, {scaleX: 0.42, duration: 0.9, ease: "expo.out"}, 1.0);
tl.fromTo("#url", {opacity: 0, y: 10, scale: 1.06}, {opacity: 1, y: 0, scale: 1, duration: 0.9, ease: "power3.out"}, 1.25);
tl.fromTo("#brilho", {opacity: 0.8, backgroundPosition: "100% 0"}, {opacity: 0.8, backgroundPosition: "0% 0", duration: 0.9, ease: "power2.inOut"}, 1.9);
tl.to("#preto", {opacity: 1, duration: 0.6, ease: "power1.in"}, 3.9);

window.__timelines["vinheta"] = tl;
</script>
</body></html>
