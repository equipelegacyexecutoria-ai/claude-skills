.marca.fg { background:linear-gradient(100deg,#f97316,#f59e0b); box-shadow:0 16px 34px rgba(249,115,22,.35); }

/* variações do foco */
.foco { position:absolute; border-radius:32px; }
#fA { left:190px; top:600px; width:700px; height:540px; }
.slot { position:absolute; left:40px; width:620px; height:110px; border-radius:22px; display:flex; align-items:center; padding-left:30px; font-weight:800; font-size:34px; }
.slot.ruim { background:#fff4ec; border:2px solid #fed7aa; color:#c2410c; }
.slot.bom { background:linear-gradient(110deg,#2f7bff,#4d93ff); color:#fff; box-shadow:0 16px 34px rgba(47,123,255,.3); }
.slot small { margin-left:auto; margin-right:28px; font-weight:700; font-size:20px; opacity:.8; }
#fB { left:150px; top:600px; width:780px; height:620px; }
.col { position:absolute; top:96px; width:340px; height:490px; border-radius:24px; background:#f3f7fd; border:1.5px dashed #c9d8ee; }
.colt { position:absolute; top:40px; font-weight:800; font-size:22px; letter-spacing:4px; }
.tar { position:absolute; left:50px; width:300px; height:96px; border-radius:20px; background:#fff; border:1.5px solid #e1e9f5; box-shadow:0 8px 20px rgba(20,50,110,.08); font-weight:800; font-size:30px; color:var(--navy); padding:30px 0 0 26px; }
.tar b { position:absolute; right:18px; top:28px; width:40px; height:40px; border-radius:50%; background:#10b981; color:#fff; font-size:22px; display:flex; align-items:center; justify-content:center; }
.seu { position:absolute; left:50px; width:300px; height:250px; border-radius:24px; background:linear-gradient(140deg,#2f7bff,#4d93ff); color:#fff; text-align:center; padding-top:40px; box-shadow:0 20px 44px rgba(47,123,255,.35); }
.seu .st { font-size:64px; line-height:1; }
.seu .s1 { margin-top:16px; font-weight:800; font-size:32px; line-height:1.15; }
#fC { left:170px; top:660px; width:740px; height:420px; }
.barra2 { position:absolute; left:40px; top:120px; width:660px; height:110px; border-radius:26px; background:#eef3fb; overflow:hidden; display:flex; gap:10px; padding:10px; }
.barra2 .lar { height:90px; border-radius:18px; background:linear-gradient(110deg,#f97316,#f59e0b); }
.barra2 .az { height:90px; border-radius:18px; background:linear-gradient(110deg,#2f7bff,#4d93ff); }
.lg { position:absolute; top:268px; display:flex; align-items:center; gap:12px; font-weight:700; font-size:28px; }
.lg i { width:22px; height:22px; border-radius:7px; }
#flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
#azul { position:absolute; inset:0; background:linear-gradient(120deg,#2f7bff,#7cc4ff); opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">

  <div id="fundo" class="cena"><div id="bg"></div><div id="blob1" class="blob"></div><div id="blob2" class="blob"></div><div id="grade"></div></div>

  <div id="lente"><div id="camera">

  <!-- CENA 1 (exemplo): cartão de vidro com número que conta -->
  <div id="s1" class="cena palco">
    <div id="c-receita" class="vidro p3">
      <div class="abs rot" style="left:44px; top:40px;">Receita · Outubro</div>
      <div id="rec-v" class="abs num" style="left:42px; top:76px; font-size:110px;">R$ 0</div>
      <div class="abs chipv" style="right:40px; top:34px; background:#e8f7ef; color:#047857;">▲ 12,4%</div>
    </div>
  </div>

  <!-- CENA 2 (exemplo): tela da plataforma em 3D (janela com barra lateral, fonte Urbanist) -->
  <div id="s2" class="cena palco">
    <div id="win1" class="win p3" style="left:90px; top:560px; width:900px; height:700px;">
      <div class="side"><img src="assets/img/plan_logo.svg"/><div class="it on" style="top:110px"></div><div class="it" style="top:160px"></div><div class="it" style="top:210px"></div></div>
      <div class="topo"><div class="t">PAINEL DE METAS</div></div>
      <div class="corpo"><div class="h1">Metas de novembro</div><div class="h2">Cada meta com um responsável</div>
        <div class="card kpi" style="left:26px; top:100px; width:250px; height:120px;"><div class="r">MRR</div><div class="v" id="kpi1">R$ 0</div><div class="d">▲ 4,2%</div></div>
      </div>
    </div>
  </div>

  <!-- CENA 3 (exemplo): fecho com logo -->
  <div id="s3" class="cena palco">
    <img id="logo-fim" src="assets/img/logo_navy.svg" />
  </div>

  </div></div>

  <div id="lente2"><div id="cam-l"><div id="letras"></div></div></div>
  <div id="azul"></div>
  <div id="flash"></div>

  <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="8" data-track-index="40"></audio>
</div>

<script>
(function () {
  const tlr = gsap.timeline({ paused: true });
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tlr;
  const M = (x) => x;   // tempos já na voz final (no Legacy Plan havia mapas de voz antiga -> nova; aqui não precisa)
  const tl = { to: (a, b, q) => tlr.to(a, b, M(q)), fromTo: (a, b, c, q) => tlr.fromTo(a, b, c, M(q)), set: (a, b, q) => tlr.set(a, b, M(q)) };
  const DUR = 8;
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));

  // palavras da narração e o início de cada uma em segundos do vídeo (gerado por scripts/palavras_js.py)
  const TX = ["Sua","empresa","fatura,"];
  const TT = [0.25,0.43,0.71];

  // gerador fixo (mesmo resultado em todo render)
  let semente = 7;
  const rnd = () => { semente = (semente * 16807) % 2147483647; return (semente - 1) / 2147483646; };
  const br = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  function contar(el, de, ate, t, dur, fmt, ease) {
    const o = { v: de };
    el.textContent = fmt(de);
    tl.fromTo(o, { v: de }, { v: ate, duration: dur, ease: ease || "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, t);
  }
  function mostra(el, t, de, dur) {
    tl.fromTo(el, Object.assign({ autoAlpha: 0 }, de || {}), { autoAlpha: 1, x: 0, y: 0, z: 0, scale: 1, rotationX: 0, rotationY: 0, rotation: 0, filter: "blur(0px)", duration: dur || 0.6, ease: "expo.out" }, t);
  }
  function some(el, t, para, dur) {
    tl.to(el, Object.assign({ autoAlpha: 0, filter: "blur(16px)", duration: dur || 0.3, ease: "power2.in" }, para || {}), t);
  }

  // ---------- letreiro (palavra a palavra, no tempo da voz) ----------
  // saida/fim/risco já no tempo da voz nova (sem mapa)
  const letras = $("#letras");
  let nG = 0;
  function grupo(top, linhas, saida, opt) {
    opt = opt || {};
    const g = document.createElement("div");
    g.className = "grp";
    g.style.top = top + "px";
    letras.appendChild(g);
    let ini = 99, k = 0;
    linhas.forEach((ln) => {
      const L = document.createElement("span");
      L.className = "ln";
      g.appendChild(L);
      ln.forEach((p) => {
        const i = p[0], cls = p[1] || "";
        const w = document.createElement("span");
        w.className = "w " + cls;
        const tx = document.createElement("span");
        tx.className = "tx";
        tx.textContent = p[2] || TX[i];
        let marca = null, risco = null;
        if (cls.indexOf("hl") >= 0) { marca = document.createElement("span"); marca.className = "marca" + (cls.indexOf("cz") >= 0 ? " cz" : "") + (cls.indexOf("fg") >= 0 ? " fg" : ""); w.appendChild(marca); }
        w.appendChild(tx);
        if (cls.indexOf("rs") >= 0) { risco = document.createElement("span"); risco.className = "risco"; w.appendChild(risco); }
        L.appendChild(w);
        const t = TT[i];
        ini = Math.min(ini, t);
        const grande = cls.indexOf("big") >= 0 || cls.indexOf("xl") >= 0;
        tlr.fromTo(w, { opacity: 0, filter: "blur(18px)", y: grande ? 50 : 34, x: (k % 2 ? 1 : -1) * (grande ? 30 : 16), scale: grande ? 1.6 : 1.35 },
          { opacity: 1, filter: "blur(0px)", y: 0, x: 0, scale: 1, duration: 0.5, ease: "expo.out" }, t - 0.06);
        if (marca) {
          tlr.fromTo(marca, { scaleX: 0 }, { scaleX: 1, duration: 0.32, ease: "power3.out" }, t + 0.06);
          tlr.fromTo(tx, { color: "#0a1a33" }, { color: "#ffffff", duration: 0.2 }, t + 0.12);
        }
        if (risco) tlr.fromTo(risco, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power3.inOut" }, opt.risco || t + 0.4);
        k++;
      });
    });
    const fim = opt.fim || saida;
    nG++;
    const lado = nG % 2 ? 1 : -1;
    // câmera orbita a frase na chegada e vai chegando perto enquanto ela fica na tela
    tlr.fromTo(g, { rotationY: lado * 22, rotationX: 8, z: -260 }, { rotationY: 0, rotationX: 0, z: 0, duration: 0.7, ease: "expo.out" }, ini - 0.06);
    tlr.fromTo(g, { scale: 1 }, { scale: 1.08, duration: Math.max(0.3, fim - ini), ease: "none" }, ini);
    tlr.to(g, { rotationY: -lado * 5, duration: Math.max(0.3, fim - ini - 0.7), ease: "sine.inOut" }, ini + 0.64);
    // palavra de destaque gigante e borrada lá atrás (profundidade)
    const hl = linhas.flat().find((p) => (p[1] || "").indexOf("hl") >= 0 && (p[1] || "").indexOf("cz") < 0);
    if (hl && !opt.semFantasma) {
      const f = document.createElement("div");
      f.className = "fant";
      f.textContent = (hl[2] || TX[hl[0]]).replace(/[.,?!]/g, "");
      f.style.top = (top - 40) + "px";
      letras.insertBefore(f, letras.firstChild);
      const t0 = TT[hl[0]];
      tlr.fromTo(f, { x: lado * 160, z: -300, scale: 0.9 }, { x: -lado * 120, z: -300, scale: 1.05, duration: Math.max(0.5, fim - t0), ease: "none" }, t0);
      tlr.fromTo(f, { opacity: 0 }, { opacity: 1, duration: 0.35 }, t0);
      tlr.to(f, { opacity: 0, duration: 0.25 }, Math.max(t0 + 0.4, fim - 0.14));
    }
    // saída: a câmera atravessa a frase
    if (saida < DUR) tlr.to(g, { opacity: 0, filter: "blur(16px)", scale: 1.7, z: 240, duration: 0.22, ease: "power2.in" }, saida - 0.14);
    return g;
  }


  // ======== CENAS (exemplo: troque pelos blocos do seu roteiro) ========
  // letreiro: grupo(top_px, [[ [índice_da_palavra, "classes"], ... ], ...linha2], saida_s)
  //   classes: sm (pequena), big, xl (gigante), dim (cinza), hl (marca azul atrás), hl cz (marca cinza), hl fg (marca laranja), rs (risco)
  grupo(560, [[[0, "sm dim"], [1, "sm dim"]], [[2, "xl"]]], 1.4);
  mostra("#c-receita", 0.7, { y: 260, z: -500, rotationX: 48, scale: 0.8, filter: "blur(20px)" }, 0.8);
  contar($("#rec-v"), 0, 82150, 0.8, 0.75, (v) => "R$ " + br(v));
  some("#c-receita", 2.6, { y: -420, z: -300, rotationX: -40, scale: 0.7 }, 0.32);
  mostra("#win1", 3.4, { z: -900, rotationX: 38, rotationY: -18, filter: "blur(18px)" }, 0.9);
  tl.to("#win1", { rotationY: 8, rotationX: 6, duration: 2.2, ease: "sine.inOut" }, 4.3);
  contar($("#kpi1"), 0, 82150, 3.9, 0.8, (v) => "R$ " + br(v));
  mostra("#logo-fim", 6.6, { y: 60, scale: 0.9, filter: "blur(14px)" }, 0.8);

  // ======== câmera: parada, só anda com intenção ========
  let CAM = null;
  (function () {
    // cada cena mora num ponto do mundo; a câmera viaja de uma para outra
    const P = { s1: [0, 0], s2: [0, 2300], s3: [1700, 2300] };
    const lugar = { "#s1": "s1", "#s2": "s2", "#s3": "s3" };
    Object.keys(lugar).forEach((sel) => { const q = P[lugar[sel]]; $(sel).style.translate = q[0] + "px " + q[1] + "px"; });

    const cam = $("#camera");
    const curT = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    curT.setAttribute("id", "curT"); curT.setAttribute("viewBox", "0 0 58 70");
    curT.innerHTML = '<path d="M4 4 L4 56 L18 44 L28 66 L38 61 L28 40 L50 40 Z" fill="#2f7bff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>';
    cam.insertBefore(curT, cam.firstChild);
    tl.set(curT, { autoAlpha: 0 }, 0);

    const C = (k) => [P[k][0] + 540, P[k][1] + 960];
    let atual = "s1";
    gsap.set(cam, { x: 0, y: 0, transformOrigin: "540px 960px" });

    // viagem: a linha nasce na cena atual, a setinha corre por ela e a câmera vai junto
    function viagem(t, para, dur) {
      dur = dur || 0.7;
      const a = C(atual), b = C(para);
      const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
      const ang = Math.atan2(dy, dx) * 180 / Math.PI - 90;
      const lig = document.createElement("div");
      lig.className = "lig";
      lig.style.left = (a[0] - 4) + "px"; lig.style.top = a[1] + "px"; lig.style.height = L + "px";
      lig.style.transform = "rotate(" + ang + "deg)";
      const i = document.createElement("i");
      lig.appendChild(i);
      cam.insertBefore(lig, cam.firstChild);
      tl.fromTo(i, { scaleY: 0 }, { scaleY: 1, duration: dur + 0.15, ease: "power3.inOut" }, t - 0.15);
      tl.fromTo(lig, { opacity: 1 }, { opacity: 0, duration: 0.25, immediateRender: false }, t + dur - 0.15);
      // setinha corre na frente da câmera
      tl.set(curT, { x: a[0] + 30, y: a[1] + 40, rotation: ang + 160, autoAlpha: 0 }, t - 0.2);
      tl.to(curT, { autoAlpha: 1, duration: 0.12 }, t - 0.2);
      tl.to(curT, { x: b[0] + 30, y: b[1] + 40, duration: dur, ease: "power3.inOut" }, t - 0.08);
      tl.to(curT, { autoAlpha: 0, duration: 0.2 }, t + dur + 0.05);
      // câmera: anda, recua um pouco no meio do caminho e borra com a velocidade
      tl.to(cam, { x: -P[para][0], y: -P[para][1], duration: dur, ease: "power3.inOut" }, t);
      tl.set(cam, { transformOrigin: b[0] + "px " + b[1] + "px" }, t);
      tl.to(cam, { scale: 0.86, filter: "blur(6px)", duration: dur / 2, ease: "power2.in" }, t);
      tl.to(cam, { scale: 1, filter: "blur(0px)", duration: dur / 2, ease: "power2.out" }, t + dur / 2);
      atual = para;
    }
    // salto escondido (atrás do azul ou de uma passagem)
    function salto(t, para) {
      tl.set(cam, { x: -P[para][0], y: -P[para][1], transformOrigin: C(para)[0] + "px " + C(para)[1] + "px" }, t);
      atual = para;
    }
    // aproximação no ponto importante (câmera chega perto e volta devagar)
    function chega(t, quanto, dur, ox, oy, hold) {
      const c = C(atual);
      tl.set(cam, { transformOrigin: (c[0] + (ox || 0)) + "px " + (c[1] + (oy || 0)) + "px" }, t - 0.01);
      tl.to(cam, { scale: quanto, duration: dur || 0.6, ease: "power3.out" }, t);
      tl.to(cam, { scale: 1, duration: 0.5, ease: "power2.inOut" }, t + (dur || 0.6) + (hold == null ? 0.5 : hold));
    }

    chega(0.9, 1.06, 0.6, 0, -200);   // aproxima no número
    viagem(3.1, "s2", 0.65);          // desce até a plataforma
    viagem(6.2, "s3", 0.6);           // vai para o fecho
    CAM = { viagem, chega };
  })();

  // fundo respira o tempo todo
  tl.fromTo("#grade", { y: 0 }, { y: -300, duration: DUR, ease: "none" }, 0);
  tl.fromTo("#blob1", { x: 0, y: 0 }, { x: 260, y: 300, duration: DUR, ease: "sine.inOut" }, 0);
  tl.fromTo("#blob2", { x: 0, y: 0 }, { x: -300, y: -260, duration: DUR, ease: "sine.inOut" }, 0);
  tlr.set({}, {}, DUR);
})();
</script>
</body>
